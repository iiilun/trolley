<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="十個電車難題，一份關於你如何選擇的極簡自我探索。">
  <title>Trolley — 你的選擇，你的輪廓</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='white'/%3E%3Cpath d='M11 30V2M21 30V2M11 18L27 2M21 21L31 11M8 8H24M8 14H24M8 23H24' stroke='black' stroke-width='1.5' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <div id="app">
    <section id="welcome" class="screen welcome">
      <header class="masthead"><span>TROLLEY</span><span class="edition">A STUDY OF CHOICE · 10 SCENES</span></header>
      <main class="welcome-main">
        <div class="welcome-mark" aria-hidden="true"><svg viewBox="0 0 80 100"><path d="M29 100V8M39 100V8M29 54L66 8M39 58L74 15M24 22H44M24 36H44M24 74H44M24 90H44" fill="none" stroke="currentColor" stroke-width="1"/></svg></div>
        <p class="eyebrow">在選擇之前</p>
        <h1>你是誰？</h1>
        <form id="name-form" autocomplete="off">
          <div class="name-line"><label class="sr-only" for="name">你的名字</label><input id="name" name="name" maxlength="24" placeholder="你的名字" required aria-describedby="name-hint"><button class="enter-button" type="submit" aria-label="開始測試"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v9H6m5-5-5 5 5 5"/></svg></button></div>
          <p id="name-hint" class="name-hint">輸入名字，按 Enter。</p>
        </form>
      </main>
      <footer class="welcome-footer"><span>沒有正確答案。</span><span>只有你的選擇。</span></footer>
    </section>
    <section id="game" class="screen game" hidden>
      <div id="progress" class="progress" role="img" aria-label="第 1 關，共 10 關"></div>
      <div id="world" class="world"><svg id="scene" viewBox="0 0 600 720" aria-hidden="true"></svg></div>
      <div id="mechanism" class="mechanism"></div>
      <div id="intro" class="intro" hidden>
        <div class="intro-inner"><p id="scene-number" class="eyebrow"></p><h2 id="scene-title"></h2><p id="scene-copy" class="scene-copy"></p><div class="scenario-effects"><p id="action-copy"></p><p id="inaction-copy"></p></div><p id="gesture-copy" class="gesture-copy"></p><div class="readiness" aria-hidden="true"><div id="readiness-fill"></div></div></div>
      </div>
      <div id="pause-overlay" class="pause-overlay" hidden><p>時間暫停。</p><button id="resume" class="text-button">繼續</button></div>
      <p id="announcement" class="sr-only" aria-live="polite"></p>
    </section>
    <section id="results" class="screen results" hidden></section>
  </div>
</body>
</html>
