<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff">
<title>Trolley</title><meta name="description" content="十次選擇。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script defer src="app.js"></script>
</head>
<body>
<section id="welcome" class="screen welcome">
<header class="logotype">TROLLEY</header>
<main class="welcome-main"><h1 id="setup-title">你是誰？</h1><form id="setup-form" autocomplete="off"><label id="setup-label" class="sr-only" for="setup-name">你的名字</label><input id="setup-name" name="name" maxlength="24" aria-label="你的名字" required enterkeyhint="next"><button class="sr-only enter-button" type="submit" aria-label="下一步">下一步</button></form></main>
</section>
<section id="game" class="screen game" hidden>
<div id="world" class="world"><svg id="scene" viewBox="0 0 1000 600" aria-hidden="true"></svg><div id="scene-object" class="scene-object"></div></div>
<div id="mechanism" class="mechanism"></div>
<div id="intro" class="intro" tabindex="0" role="group" aria-label="情境說明；點一下或按 Enter 開始" hidden><header class="logotype">TROLLEY</header><div class="intro-inner"><div class="intro-copy"><h2 id="scene-title"></h2><p id="scene-copy"></p><div class="scenario-effects"><p id="action-copy"></p><p id="inaction-copy"></p></div></div><svg id="demo" viewBox="0 0 360 220" aria-hidden="true"></svg></div></div>
<div id="pause-overlay" class="pause-overlay" hidden><button id="resume" class="text-button" aria-label="繼續">繼續</button></div><p id="announcement" class="sr-only" aria-live="polite"></p>
</section>
<section id="results" class="screen results" hidden></section>
</body></html>
